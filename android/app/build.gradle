plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vrmonitor'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vrmonitor'
        minSdk 26
        targetSdk 34
        versionCode 100
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
